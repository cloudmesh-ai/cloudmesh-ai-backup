site_name: Cloudmesh AI Backup
docs_dir: docs
use_directory_urls: false
theme:
  name: material
extra_css:
- css/custom.css
nav:
- Home: readme.md
- Project:
  - Changelog: CHANGELOG.md
  - GitHub: https://github.com/cloudmesh-ai/cloudmesh-ai-backup
  - Issues: https://github.com/cloudmesh-ai/cloudmesh-ai-backup/issues
- API Reference: api.md
plugins:
- cloudmesh-ai-theme
- search
- mkdocstrings:
    handlers:
      python:
        paths:
        - src
        options:
          docstring_style: google
          show_submodules: true
          members: true
          docstring_section_style: table
          show_source: true
          group_by_category: true
          show_category_heading: true
          separate_signature: true
          show_root_full_path: true

markdown_extensions:
  - pymdownx.highlight:
      use_pygments: true
      anchor_linenums: true
      line_spans: __span
      pygments_style: colorful
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed
  - admonition
  - pymdownx.details